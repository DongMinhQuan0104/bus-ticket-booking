<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Quản lý tài khoản')}"></head>
<body class="bg-surface-bright text-on-surface font-body-main text-body-main antialiased">
<nav th:replace="~{admin/layout :: sidebar('accounts')}"></nav>
<header th:replace="~{admin/layout :: topbar}"></header>

<main class="ml-64 pt-16 min-h-screen">
    <div class="max-w-[1200px] mx-auto px-12 py-12">
        <div th:replace="~{admin/layout :: flash}"></div>

        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="font-headline-md text-headline-md text-on-surface mb-2">Quản lý tài khoản</h1>
                <p class="font-body-main text-body-main text-on-surface-variant">Quản trị người dùng: quản trị viên, tài xế, khách hàng.</p>
            </div>
            <button type="button" onclick="openCreate()"
                    class="bg-secondary-container text-white px-6 py-3 rounded-lg font-title-sm text-title-sm hover:brightness-90 transition-all flex items-center gap-2 shadow-sm whitespace-nowrap active:translate-y-px">
                <span class="material-symbols-outlined">person_add</span> Thêm tài khoản
            </button>
        </div>

        <form method="get" th:action="@{/admin/accounts}"
              class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant mb-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-wrap gap-4 items-center">
            <div class="relative min-w-[250px] flex-1">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
                <input name="q" th:value="${q}" type="text" placeholder="Tìm theo họ tên..."
                       class="w-full border border-outline-variant rounded-lg py-2 pl-10 pr-4 font-body-main text-body-main focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all bg-surface-bright"/>
            </div>
            <button type="submit" class="bg-primary text-white px-5 py-2 rounded-lg font-title-sm text-title-sm hover:brightness-110">Tìm</button>
        </form>

        <div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-surface-container-low border-b border-outline-variant">
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Họ tên</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Email</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">SĐT</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Vai trò</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Trạng thái</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase text-right">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-outline-variant">
                    <tr th:if="${accounts.content.isEmpty()}">
                        <td colspan="6" class="py-8 px-6 text-center text-on-surface-variant">Chưa có tài khoản nào.</td>
                    </tr>
                    <tr th:each="acc : ${accounts.content}" class="hover:bg-surface-bright transition-colors duration-150 group">
                        <td class="py-4 px-6 font-title-sm text-title-sm text-on-surface" th:text="${acc.fullName()}">Họ tên</td>
                        <td class="py-4 px-6 font-body-main text-on-surface" th:text="${acc.email()}">email</td>
                        <td class="py-4 px-6 font-body-main text-on-surface" th:text="${acc.phoneNumber()}">SĐT</td>
                        <td class="py-4 px-6">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-sm font-medium bg-primary-fixed text-on-primary-fixed" th:text="${acc.role()}">ROLE</span>
                        </td>
                        <td class="py-4 px-6">
                            <span th:if="${acc.status() != null and acc.status().name() == 'AVAILABLE'}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-sm font-medium bg-tertiary-fixed text-on-tertiary-fixed">
                                <span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span> Hoạt động
                            </span>
                            <span th:unless="${acc.status() != null and acc.status().name() == 'AVAILABLE'}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-sm font-medium bg-error-container text-on-error-container">
                                <span class="w-1.5 h-1.5 rounded-full bg-error"></span> Bị khóa
                            </span>
                        </td>
                        <td class="py-4 px-6 text-right whitespace-nowrap">
                            <button type="button" class="text-on-surface-variant hover:text-primary transition-colors p-1" title="Chỉnh sửa"
                                    th:attr="onclick=|openEdit('${acc.id()}','${acc.fullName()}','${acc.email()}','${acc.phoneNumber()}','${acc.role()}','${acc.status()}')|">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <form method="post" th:action="@{'/admin/accounts/' + ${acc.id()} + '/delete'}" class="inline" onsubmit="return confirm('Xóa tài khoản này?');">
                                <button type="submit" class="text-on-surface-variant hover:text-error transition-colors p-1 ml-2" title="Xóa">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="border-t border-outline-variant p-4 flex items-center justify-between bg-surface-container-lowest">
                <span class="font-body-sm text-body-sm text-on-surface-variant"
                      th:text="'Trang ' + (${accounts.page} + 1) + ' / ' + (${accounts.totalPages == 0} ? 1 : ${accounts.totalPages}) + ' — ' + ${accounts.totalElements} + ' tài khoản'">Trang 1</span>
                <div class="flex gap-2">
                    <a th:href="@{/admin/accounts(page=${accounts.page - 1}, q=${q})}" th:classappend="${accounts.page == 0} ? 'opacity-50 pointer-events-none' : ''" class="p-2 border border-outline-variant rounded-lg text-on-surface-variant hover:bg-surface-container-low"><span class="material-symbols-outlined text-sm">chevron_left</span></a>
                    <a th:href="@{/admin/accounts(page=${accounts.page + 1}, q=${q})}" th:classappend="${accounts.last} ? 'opacity-50 pointer-events-none' : ''" class="p-2 border border-outline-variant rounded-lg text-on-surface-variant hover:bg-surface-container-low"><span class="material-symbols-outlined text-sm">chevron_right</span></a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- MODAL -->
<div id="accModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-lg">
        <div class="flex items-center justify-between p-6 border-b border-outline-variant">
            <h2 id="modalTitle" class="font-title-sm text-title-sm text-on-surface">Thêm tài khoản</h2>
            <button type="button" onclick="closeModal()" class="text-on-surface-variant hover:text-error"><span class="material-symbols-outlined">close</span></button>
        </div>
        <form id="accForm" method="post" class="p-6 flex flex-col gap-4">
            <div id="nameWrap">
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Họ tên</label>
                <input id="f_name" name="fullName" type="text" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
            </div>
            <div>
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Email</label>
                <input id="f_email" name="email" type="email" required class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
            </div>
            <div id="phoneWrap">
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Số điện thoại</label>
                <input id="f_phone" name="phoneNumber" type="text" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
            </div>
            <div>
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Mật khẩu <span id="pwHint" class="normal-case text-outline">(để trống nếu không đổi)</span></label>
                <input id="f_pw" name="password" type="password" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Vai trò</label>
                    <select id="f_role" name="role" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div id="statusWrap">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Trạng thái</label>
                    <select id="f_status" name="status" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name() == 'AVAILABLE'} ? 'Hoạt động' : 'Bị khóa'"></option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container-low">Hủy</button>
                <button type="submit" class="px-5 py-2 rounded-lg bg-primary text-white font-title-sm text-title-sm hover:brightness-110">Lưu</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const modal = document.getElementById('accModal');
    const form = document.getElementById('accForm');
    const createUrl = /*[[@{/admin/accounts/create}]]*/ '/admin/accounts/create';
    function show(){ modal.classList.remove('hidden'); modal.classList.add('flex'); }
    function closeModal(){ modal.classList.add('hidden'); modal.classList.remove('flex'); }
    function openCreate(){
        document.getElementById('modalTitle').textContent = 'Thêm tài khoản';
        form.action = createUrl; form.reset();
        // Form tao chi nhan role/email/password -> an ho ten, sdt, trang thai
        document.getElementById('nameWrap').classList.add('hidden');
        document.getElementById('phoneWrap').classList.add('hidden');
        document.getElementById('statusWrap').classList.add('hidden');
        document.getElementById('f_pw').required = true;
        document.getElementById('pwHint').classList.add('hidden');
        show();
    }
    function openEdit(id, name, email, phone, role, status){
        document.getElementById('modalTitle').textContent = 'Chỉnh sửa tài khoản';
        form.action = /*[[@{/admin/accounts/}]]*/ '/admin/accounts/' + id + '/update';
        document.getElementById('nameWrap').classList.remove('hidden');
        document.getElementById('phoneWrap').classList.remove('hidden');
        document.getElementById('statusWrap').classList.remove('hidden');
        document.getElementById('f_name').value = name;
        document.getElementById('f_email').value = email;
        document.getElementById('f_phone').value = (phone === 'null') ? '' : phone;
        document.getElementById('f_role').value = role;
        document.getElementById('f_status').value = status;
        document.getElementById('f_pw').value = '';
        document.getElementById('f_pw').required = false;
        document.getElementById('pwHint').classList.remove('hidden');
        show();
    }
</script>
</body>
</html>
