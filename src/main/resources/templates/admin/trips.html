<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Quản lý chuyến xe')}"></head>
<body class="bg-surface-bright text-on-surface font-body-main text-body-main antialiased">
<nav th:replace="~{admin/layout :: sidebar('trips')}"></nav>
<header th:replace="~{admin/layout :: topbar}"></header>

<main class="ml-64 pt-16 min-h-screen">
    <div class="max-w-[1200px] mx-auto px-12 py-12">
        <div th:replace="~{admin/layout :: flash}"></div>

        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="font-headline-md text-headline-md text-on-surface mb-2">Quản lý chuyến xe</h1>
                <p class="font-body-main text-body-main text-on-surface-variant">Tạo, sửa, xóa các chuyến xe trong hệ thống.</p>
            </div>
            <button type="button" onclick="openCreate()"
                    class="bg-secondary-container text-white px-6 py-3 rounded-lg font-title-sm text-title-sm hover:brightness-90 transition-all flex items-center gap-2 shadow-sm whitespace-nowrap active:translate-y-px">
                <span class="material-symbols-outlined">add</span> Thêm chuyến mới
            </button>
        </div>

        <div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-surface-container-low border-b border-outline-variant">
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Tuyến</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Khởi hành</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Tài xế</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Xe</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Giá vé</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Trạng thái</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase text-right">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-outline-variant">
                    <tr th:if="${trips.content.isEmpty()}">
                        <td colspan="7" class="py-8 px-6 text-center text-on-surface-variant">Chưa có chuyến nào.</td>
                    </tr>
                    <tr th:each="trip : ${trips.content}" class="hover:bg-surface-bright transition-colors duration-150 group">
                        <td class="py-4 px-6">
                            <div class="font-title-sm text-title-sm text-on-surface" th:text="${trip.destinationFrom()} + ' → ' + ${trip.destinationTo()}">Tuyến</div>
                        </td>
                        <td class="py-4 px-6 font-data-mono text-body-sm text-on-surface"
                            th:text="${trip.departureTime() != null} ? ${#temporals.format(trip.departureTime(), 'dd/MM/yyyy HH:mm')} : '—'">--</td>
                        <td class="py-4 px-6 font-body-main text-on-surface" th:text="${trip.driverName()}">Tài xế</td>
                        <td class="py-4 px-6 font-body-main text-on-surface" th:text="${trip.busName()}">Xe</td>
                        <td class="py-4 px-6 font-data-price text-data-price text-primary"
                            th:text="${trip.price() != null} ? ${#numbers.formatDecimal(trip.price(),0,'COMMA',0,'POINT')} + ' đ' : '—'">0 đ</td>
                        <td class="py-4 px-6">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-sm font-medium bg-primary-fixed text-on-primary-fixed"
                                  th:text="${trip.status()}">SCHEDULED</span>
                        </td>
                        <td class="py-4 px-6 text-right whitespace-nowrap">
                            <button type="button" class="text-on-surface-variant hover:text-primary transition-colors p-1" title="Chỉnh sửa"
                                    th:attr="onclick=|openEdit('${trip.id()}','${trip.destinationFrom()}','${trip.destinationTo()}','${trip.departureTime() != null ? #temporals.format(trip.departureTime(),'yyyy-MM-dd''T''HH:mm') : ''}','${trip.driverName()}','${trip.price()}','${trip.routeId()}','${trip.busId()}','${trip.status()}')|">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <form method="post" th:action="@{'/admin/trips/' + ${trip.id()} + '/delete'}" class="inline" onsubmit="return confirm('Xóa chuyến này?');">
                                <button type="submit" class="text-on-surface-variant hover:text-error transition-colors p-1 ml-2" title="Xóa">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="border-t border-outline-variant p-4 flex items-center justify-between bg-surface-container-lowest">
                <span class="font-body-sm text-body-sm text-on-surface-variant"
                      th:text="'Trang ' + (${trips.page} + 1) + ' / ' + (${trips.totalPages == 0} ? 1 : ${trips.totalPages}) + ' — ' + ${trips.totalElements} + ' chuyến'">Trang 1</span>
                <div class="flex gap-2">
                    <a th:href="@{/admin/trips(page=${trips.page - 1})}" th:classappend="${trips.page == 0} ? 'opacity-50 pointer-events-none' : ''" class="p-2 border border-outline-variant rounded-lg text-on-surface-variant hover:bg-surface-container-low"><span class="material-symbols-outlined text-sm">chevron_left</span></a>
                    <a th:href="@{/admin/trips(page=${trips.page + 1})}" th:classappend="${trips.last} ? 'opacity-50 pointer-events-none' : ''" class="p-2 border border-outline-variant rounded-lg text-on-surface-variant hover:bg-surface-container-low"><span class="material-symbols-outlined text-sm">chevron_right</span></a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- MODAL Thêm/Sửa chuyến -->
<div id="tripModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-6 border-b border-outline-variant">
            <h2 id="modalTitle" class="font-title-sm text-title-sm text-on-surface">Thêm chuyến mới</h2>
            <button type="button" onclick="closeModal()" class="text-on-surface-variant hover:text-error"><span class="material-symbols-outlined">close</span></button>
        </div>
        <form id="tripForm" method="post" class="p-6 flex flex-col gap-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Điểm đi</label>
                    <input id="f_from" name="destinationFrom" type="text" required class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
                </div>
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Điểm đến</label>
                    <input id="f_to" name="destinationTo" type="text" required class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
                </div>
            </div>
            <div>
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Giờ khởi hành</label>
                <input id="f_depart" name="departureTime" type="datetime-local" required class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Tài xế</label>
                    <input id="f_driver" name="driverName" type="text" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
                </div>
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Giá vé (đ)</label>
                    <input id="f_price" name="price" type="number" step="1000" min="0" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
                </div>
            </div>
            <div>
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Tuyến</label>
                <select id="f_route" name="routeId" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                    <option value="">-- Chọn tuyến --</option>
                    <option th:each="r : ${routes}" th:value="${r.id()}" th:text="${r.name()}"></option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Xe</label>
                    <select id="f_bus" name="busId" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                        <option value="">-- Chọn xe --</option>
                        <option th:each="b : ${buses}" th:value="${b.id()}" th:text="${b.busName()} + ' (' + ${b.licensePlate()} + ')'"></option>
                    </select>
                </div>
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Trạng thái</label>
                    <select id="f_status" name="status" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                        <option th:each="s : ${tripStatuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container-low">Hủy</button>
                <button type="submit" class="px-5 py-2 rounded-lg bg-primary text-white font-title-sm text-title-sm hover:brightness-110">Lưu</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const modal = document.getElementById('tripModal');
    const form = document.getElementById('tripForm');
    const createUrl = /*[[@{/admin/trips/create}]]*/ '/admin/trips/create';
    function show(){ modal.classList.remove('hidden'); modal.classList.add('flex'); }
    function closeModal(){ modal.classList.add('hidden'); modal.classList.remove('flex'); }
    function openCreate(){
        document.getElementById('modalTitle').textContent = 'Thêm chuyến mới';
        form.action = createUrl; form.reset();
        show();
    }
    function openEdit(id, from, to, depart, driver, price, routeId, busId, status){
        document.getElementById('modalTitle').textContent = 'Chỉnh sửa chuyến';
        form.action = '/admin/trips/' + id + '/update';
        document.getElementById('f_from').value = from;
        document.getElementById('f_to').value = to;
        document.getElementById('f_depart').value = depart;
        document.getElementById('f_driver').value = (driver === 'null') ? '' : driver;
        document.getElementById('f_price').value = (price === 'null') ? '' : price;
        document.getElementById('f_route').value = (routeId === 'null') ? '' : routeId;
        document.getElementById('f_bus').value = (busId === 'null') ? '' : busId;
        document.getElementById('f_status').value = status;
        show();
    }
</script>
</body>
</html>
