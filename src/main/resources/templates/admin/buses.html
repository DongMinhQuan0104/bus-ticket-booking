<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Quản lý xe')}"></head>
<body class="bg-surface-bright text-on-surface font-body-main text-body-main antialiased">
<nav th:replace="~{admin/layout :: sidebar('buses')}"></nav>
<header th:replace="~{admin/layout :: topbar}"></header>

<main class="ml-64 pt-16 min-h-screen">
    <div class="max-w-[1200px] mx-auto px-12 py-12">
        <div th:replace="~{admin/layout :: flash}"></div>

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="font-headline-md text-headline-md text-on-surface mb-2">Quản lý xe</h1>
                <p class="font-body-main text-body-main text-on-surface-variant">Danh sách tất cả các phương tiện trong hệ thống.</p>
            </div>
            <button type="button" onclick="openCreate()"
                    class="bg-secondary-container text-white px-6 py-3 rounded-lg font-title-sm text-title-sm hover:brightness-90 transition-all flex items-center gap-2 shadow-sm whitespace-nowrap active:translate-y-px">
                <span class="material-symbols-outlined">add</span> Thêm xe mới
            </button>
        </div>

        <!-- Filter (tim theo ten/bien so) -->
        <form method="get" th:action="@{/admin/buses}"
              class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant mb-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-wrap gap-4 items-center">
            <div class="relative min-w-[250px] flex-1">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
                <input name="q" th:value="${q}" type="text" placeholder="Tìm tên xe, biển số..."
                       class="w-full border border-outline-variant rounded-lg py-2 pl-10 pr-4 font-body-main text-body-main focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all bg-surface-bright"/>
            </div>
            <button type="submit" class="bg-primary text-white px-5 py-2 rounded-lg font-title-sm text-title-sm hover:brightness-110">Tìm</button>
        </form>

        <!-- Data Table -->
        <div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-surface-container-low border-b border-outline-variant">
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Tên xe</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Biển số</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Loại xe</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Sức chứa</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Trạng thái</th>
                        <th class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase text-right">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-outline-variant">
                    <tr th:if="${buses.content.isEmpty()}">
                        <td colspan="6" class="py-8 px-6 text-center text-on-surface-variant">Chưa có xe nào.</td>
                    </tr>
                    <tr th:each="bus : ${buses.content}" class="hover:bg-surface-bright transition-colors duration-150 group">
                        <td class="py-4 px-6">
                            <div class="font-title-sm text-title-sm text-on-surface" th:text="${bus.busName()}">Tên xe</div>
                        </td>
                        <td class="py-4 px-6">
                            <span class="font-data-mono text-data-mono bg-surface-container-high px-2 py-1 rounded border border-outline-variant/50" th:text="${bus.licensePlate()}">51B-000.00</span>
                        </td>
                        <td class="py-4 px-6 font-body-main text-body-main text-on-surface"
                            th:text="${bus.busType() != null and bus.busType().name() == 'SLEEPER'} ? 'Giường nằm' : 'Ghế ngồi'">Ghế ngồi</td>
                        <td class="py-4 px-6 font-body-main text-body-main text-on-surface"
                            th:text="${bus.busCapacity() != null and bus.busCapacity().name() == 'SEAT_32'} ? '32 chỗ' : '16 chỗ'">16 chỗ</td>
                        <td class="py-4 px-6">
                            <span th:if="${bus.status() != null and bus.status().name() == 'AVAILABLE'}"
                                  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-sm font-medium bg-tertiary-fixed text-on-tertiary-fixed">
                                <span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span> Hoạt động
                            </span>
                            <span th:unless="${bus.status() != null and bus.status().name() == 'AVAILABLE'}"
                                  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-sm font-medium bg-error-container text-on-error-container">
                                <span class="w-1.5 h-1.5 rounded-full bg-error"></span> Ngừng hoạt động
                            </span>
                        </td>
                        <td class="py-4 px-6 text-right whitespace-nowrap">
                            <button type="button" class="text-on-surface-variant hover:text-primary transition-colors p-1" title="Chỉnh sửa"
                                    th:attr="onclick=|openEdit('${bus.id()}','${bus.busName()}','${bus.licensePlate()}','${bus.busType()}','${bus.busCapacity()}','${bus.status()}')|">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <form method="post" th:action="@{'/admin/buses/' + ${bus.id()} + '/delete'}" class="inline"
                                  onsubmit="return confirm('Xóa xe này?');">
                                <button type="submit" class="text-on-surface-variant hover:text-error transition-colors p-1 ml-2" title="Xóa">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div class="border-t border-outline-variant p-4 flex items-center justify-between bg-surface-container-lowest">
                <span class="font-body-sm text-body-sm text-on-surface-variant"
                      th:text="'Trang ' + (${buses.page} + 1) + ' / ' + (${buses.totalPages == 0} ? 1 : ${buses.totalPages}) + ' — ' + ${buses.totalElements} + ' xe'">Trang 1</span>
                <div class="flex gap-2">
                    <a th:href="@{/admin/buses(page=${buses.page - 1}, q=${q})}"
                       th:classappend="${buses.page == 0} ? 'opacity-50 pointer-events-none' : ''"
                       class="p-2 border border-outline-variant rounded-lg text-on-surface-variant hover:bg-surface-container-low">
                        <span class="material-symbols-outlined text-sm">chevron_left</span>
                    </a>
                    <a th:href="@{/admin/buses(page=${buses.page + 1}, q=${q})}"
                       th:classappend="${buses.last} ? 'opacity-50 pointer-events-none' : ''"
                       class="p-2 border border-outline-variant rounded-lg text-on-surface-variant hover:bg-surface-container-low">
                        <span class="material-symbols-outlined text-sm">chevron_right</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- ===================== MODAL Thêm/Sửa xe ===================== -->
<div id="busModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 p-4">
    <div class="bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-lg">
        <div class="flex items-center justify-between p-6 border-b border-outline-variant">
            <h2 id="modalTitle" class="font-title-sm text-title-sm text-on-surface">Thêm xe mới</h2>
            <button type="button" onclick="closeModal()" class="text-on-surface-variant hover:text-error"><span class="material-symbols-outlined">close</span></button>
        </div>
        <form id="busForm" method="post" class="p-6 flex flex-col gap-4">
            <div>
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Tên xe</label>
                <input id="f_name" name="name" type="text" required class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
            </div>
            <div>
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Biển số</label>
                <input id="f_plate" name="licensePlate" type="text" required class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Loại xe</label>
                    <select id="f_type" name="busType" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                        <option th:each="t : ${busTypes}" th:value="${t}" th:text="${t.name() == 'SLEEPER'} ? 'Giường nằm' : 'Ghế ngồi'"></option>
                    </select>
                </div>
                <div>
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Sức chứa</label>
                    <select id="f_cap" name="busCapacity" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                        <option th:each="c : ${busCapacities}" th:value="${c}" th:text="${c.name() == 'SEAT_32'} ? '32 chỗ' : '16 chỗ'"></option>
                    </select>
                </div>
            </div>
            <!-- Trang thai chi hien khi sua (form update co truong status) -->
            <div id="statusWrap" class="hidden">
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Trạng thái</label>
                <select id="f_status" name="status" class="mt-1 w-full border border-outline-variant rounded-lg py-2 px-3 bg-surface-bright focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name() == 'AVAILABLE'} ? 'Hoạt động' : 'Ngừng hoạt động'"></option>
                </select>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container-low">Hủy</button>
                <button type="submit" class="px-5 py-2 rounded-lg bg-primary text-white font-title-sm text-title-sm hover:brightness-110">Lưu</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const modal = document.getElementById('busModal');
    const form = document.getElementById('busForm');
    const createUrl = /*[[@{/admin/buses/create}]]*/ '/admin/buses/create';
    function show(){ modal.classList.remove('hidden'); modal.classList.add('flex'); }
    function closeModal(){ modal.classList.add('hidden'); modal.classList.remove('flex'); }
    function openCreate(){
        document.getElementById('modalTitle').textContent = 'Thêm xe mới';
        form.action = createUrl;
        form.reset();
        // form create dung field 'name' + 'busCapacity'; an trang thai
        document.getElementById('f_name').name = 'name';
        document.getElementById('f_cap').name = 'busCapacity';
        document.getElementById('statusWrap').classList.add('hidden');
        show();
    }
    function openEdit(id, name, plate, type, cap, status){
        document.getElementById('modalTitle').textContent = 'Chỉnh sửa xe';
        form.action = /*[[@{/admin/buses/}]]*/ '/admin/buses/' + id + '/update';
        // form update dung field 'busName' + 'capacity' + 'status'
        document.getElementById('f_name').name = 'busName';
        document.getElementById('f_name').value = name;
        document.getElementById('f_plate').value = plate;
        document.getElementById('f_type').value = type;
        document.getElementById('f_cap').name = 'capacity';
        document.getElementById('f_cap').value = cap;
        document.getElementById('statusWrap').classList.remove('hidden');
        document.getElementById('f_status').value = status;
        show();
    }
</script>
</body>
</html>
