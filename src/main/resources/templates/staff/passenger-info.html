<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Thông tin khách</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a class="active" th:href="@{/staff/trips}">Bán vé tại quầy</a><a th:href="@{/staff/bookings}">Quản lý đặt vé</a><a th:href="@{/staff/check-in}">Check-in hành khách</a><a th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav></aside><main class="main"><h1>Thông tin hành khách</h1><form method="post" th:action="@{/staff/bookings/create}"><input type="hidden" name="tripId" th:value="${tripId}"><input type="hidden" name="pickupStationOrder" th:value="${pickupOrder}"><input type="hidden" name="dropoffStationOrder" th:value="${dropoffOrder}"><section class="card"><h2>Thông tin người đặt</h2><div class="form-grid"><label>Họ và tên<input name="contactName" required></label><label>Số điện thoại<input name="contactPhone" required></label><label>Email<input type="email" name="contactEmail"></label></div><label>Loại đặt vé<select name="bookingType"><option th:each="type:${bookingTypes}" th:value="${type}" th:text="${type.name()=='ONEWAY'?'Một chiều':'Khứ hồi'}"></option></select></label><label>Ghi chú<textarea name="note"></textarea></label></section><section class="card"><h2>Danh sách hành khách</h2><div class="card" th:each="seat:${selectedSeats}"><input type="hidden" name="seatCode" th:value="${seat}"><h3>Ghế <span th:text="${seat}"></span></h3><div class="form-grid"><label>Tên hành khách<input name="passengerName" required></label><label>Khối lượng hành lý (kg)<input type="number" step="0.1" min="0" name="luggageWeightKg" value="0"></label></div></div></section><button class="btn btn-primary" type="submit">Tạo booking và tiếp tục thanh toán</button></form></main></div></body></html>
