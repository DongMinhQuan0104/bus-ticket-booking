<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Tìm chuyến</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a class="active" th:href="@{/staff/trips}">Bán vé tại quầy</a><a th:href="@{/staff/bookings}">Quản lý đặt vé</a><a th:href="@{/staff/check-in}">Check-in hành khách</a><a th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav><div class="profile"><strong th:text="${currentUser.fullName()}">Staff</strong><p><a th:href="@{/auth/logout}">Đăng xuất</a></p></div></aside><main class="main"><h1>Tìm chuyến xe</h1><div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div><form class="card" method="get" th:action="@{/staff/trips}"><div class="form-grid"><label>Điểm đi<input name="destinationFrom" th:value="${destinationFrom}"></label><label>Điểm đến<input name="destinationTo" th:value="${destinationTo}"></label><label>Ngày khởi hành<input type="date" name="departureDate" th:value="${departureDate}"></label></div><button class="btn btn-primary" type="submit">Tìm chuyến</button></form><section class="card" th:if="${searched}"><h2>Kết quả tìm kiếm</h2><div th:if="${#lists.isEmpty(trips)}">Không tìm thấy chuyến phù hợp.</div><div class="table-wrap" th:unless="${#lists.isEmpty(trips)}"><table><thead><tr><th>Tuyến</th><th>Khởi hành</th><th>Xe</th><th>Ghế trống</th><th>Hành động</th></tr></thead><tbody><tr th:each="t:${trips}"><td><strong th:text="${t.routeName()}"></strong><div th:text="${t.destinationFrom()+' → '+t.destinationTo()}"></div></td><td th:text="${t.departureTime()}"></td><td><span th:text="${t.busName()}"></span><br><span th:text="${t.licensePlate()}"></span></td><td th:text="${t.availableSeatCount()}"></td><td class="actions"><a class="btn btn-primary" th:href="@{/staff/trips/{id}/seats(id=${t.tripId()})}">Chọn chuyến</a><a class="btn btn-secondary" th:href="@{/staff/check-in(tripId=${t.tripId()})}">Check-in</a></td></tr></tbody></table></div></section></main></div></body></html>
