<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Chọn ghế</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a class="active" th:href="@{/staff/trips}">Bán vé tại quầy</a><a th:href="@{/staff/bookings}">Quản lý đặt vé</a><a th:href="@{/staff/check-in}">Check-in hành khách</a><a th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav></aside><main class="main"><h1>Chọn ghế</h1><div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div><form class="card" method="get"><div class="form-grid"><label>Thứ tự điểm đón<input type="number" name="pickupOrder" th:value="${pickupOrder}" required></label><label>Thứ tự điểm trả<input type="number" name="dropoffOrder" th:value="${dropoffOrder}" required></label></div><button class="btn btn-secondary">Xem ghế trống</button></form><form th:if="${loaded}" class="card" method="get" th:action="@{/staff/bookings/new}"><input type="hidden" name="tripId" th:value="${tripId}"><input type="hidden" name="pickupOrder" th:value="${pickupOrder}"><input type="hidden" name="dropoffOrder" th:value="${dropoffOrder}"><h2>Sơ đồ ghế</h2><div class="seat-grid"><label th:each="s:${seats}" th:class="${'seat '+(s.status().name()=='HELD'?'held':(s.status().name()=='BOOKED'?'booked':''))}"><input type="checkbox" name="selectedSeats" th:value="${s.seatCode()}" th:disabled="${s.status().name()!='AVAILABLE'}"><span th:text="${s.seatCode()}"></span></label></div><p><button class="btn btn-primary" type="submit">Tiếp tục nhập thông tin</button></p></form></main></div></body></html>
