<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Quản lý booking</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a th:href="@{/staff/trips}">Bán vé tại quầy</a><a class="active" th:href="@{/staff/bookings}">Quản lý đặt vé</a><a th:href="@{/staff/check-in}">Check-in hành khách</a><a th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav></aside><main class="main"><h1>Tra cứu booking</h1><form class="card" method="get"><label>Từ khóa<input name="keyword" th:value="${keyword}" placeholder="Mã booking, tên khách hoặc số điện thoại"></label><button class="btn btn-primary">Tra cứu</button></form><section class="card" th:if="${searched}"><div th:if="${#lists.isEmpty(bookings)}">Không tìm thấy booking.</div><div class="table-wrap" th:unless="${#lists.isEmpty(bookings)}"><table><tr><th>Mã</th><th>Khách</th><th>SĐT</th><th>Khởi hành</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr><tr th:each="b:${bookings}"><td th:text="${b.bookingCode()}"></td><td th:text="${b.contactName()}"></td><td th:text="${b.contactPhone()}"></td><td th:text="${b.departureTime()}"></td><td th:text="${b.totalPrice()}"></td><td><span class="badge" th:text="${b.status()}"></span></td><td><a class="btn btn-secondary" th:href="@{/staff/bookings/{id}(id=${b.bookingId()})}">Xem chi tiết</a></td></tr></table></div></section></main></div></body></html>
