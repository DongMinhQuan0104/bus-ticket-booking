<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Thanh toán</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a class="active" th:href="@{/staff/trips}">Bán vé tại quầy</a><a th:href="@{/staff/bookings}">Quản lý đặt vé</a><a th:href="@{/staff/check-in}">Check-in hành khách</a><a th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav></aside><main class="main"><h1>Thanh toán & phát hành vé</h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div><div class="grid"><section class="card"><h2>Thông tin booking</h2><p>Mã: <strong th:text="${booking.bookingCode()}"></strong></p><p>Khách: <span th:text="${booking.contactName()}"></span></p><p>Tổng tiền: <strong th:text="${booking.totalPrice() + ' đ'}"></strong></p><table><tr><th>Hành khách</th><th>Ghế</th><th>Thành tiền</th></tr><tr th:each="d:${booking.details()}"><td th:text="${d.passengerName()}"></td><td th:text="${d.seatCode()}"></td><td th:text="${d.subTotal()}"></td></tr></table></section><form class="card" method="post" th:action="@{/staff/bookings/{id}/payment(id=${booking.bookingId()})}"><h2>Xác nhận thanh toán</h2><label>Phương thức<select name="paymentMethod" id="method" onchange="toggleRef()"><option value="CASH">Tiền mặt</option><option value="BANK_TRANSFER">Chuyển khoản</option></select></label><label id="refBox" style="display:none">Mã tham chiếu<input name="referenceCode"></label><button class="btn btn-primary" type="submit">Xác nhận thanh toán</button></form></div></main></div><script>function toggleRef(){document.getElementById('refBox').style.display=document.getElementById('method').value==='BANK_TRANSFER'?'block':'none'}</script></body></html>
