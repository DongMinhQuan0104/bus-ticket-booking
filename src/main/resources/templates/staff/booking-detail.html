<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Chi tiết booking</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a th:href="@{/staff/trips}">Bán vé tại quầy</a><a class="active" th:href="@{/staff/bookings}">Quản lý đặt vé</a><a th:href="@{/staff/check-in}">Check-in hành khách</a><a th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav></aside><main class="main"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div><h1>Booking <span th:text="${booking.bookingCode()}"></span></h1><section class="card"><p>Người liên hệ: <strong th:text="${booking.contactName()}"></strong> — <span th:text="${booking.contactPhone()}"></span></p><p>Trạng thái: <span class="badge" th:text="${booking.status()}"></span></p><p>Tổng tiền: <strong th:text="${booking.totalPrice()}"></strong></p></section><section class="card"><h2>Hành khách và vé</h2><table><tr><th>Khách</th><th>Ghế</th><th>Mã vé</th><th>Trạng thái</th><th>Đổi ghế</th></tr><tr th:each="d:${booking.details()}"><td th:text="${d.passengerName()}"></td><td th:text="${d.seatCode()}"></td><td th:text="${d.ticketCode()}"></td><td th:text="${d.ticketStatus()}"></td><td><form method="post" th:action="@{/staff/bookings/{id}/change-seat(id=${booking.bookingId()})}"><input type="hidden" name="bookingDetailId" th:value="${d.bookingDetailId()}"><input name="newSeatCode" placeholder="Ghế mới" required><button class="btn btn-secondary">Đổi</button></form></td></tr></table></section><div class="grid"><form class="card" method="post" th:action="@{/staff/bookings/{id}/cancel(id=${booking.bookingId()})}"><h3>Hủy booking</h3><textarea name="reason" required placeholder="Lý do"></textarea><label><input style="width:auto" type="checkbox" name="requestRefund"> Yêu cầu hoàn tiền</label><button class="btn btn-danger">Xác nhận hủy</button></form><form class="card" method="post" th:action="@{/staff/bookings/{id}/refund(id=${booking.bookingId()})}"><h3>Xử lý hoàn tiền</h3><textarea name="reason" required placeholder="Lý do"></textarea><label><input style="width:auto" type="checkbox" name="escalateToAdmin"> Chuyển Admin</label><button class="btn btn-primary">Xác nhận</button></form></div></main></div></body></html>
