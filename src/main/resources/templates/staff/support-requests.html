<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Hỗ trợ khách hàng</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a th:href="@{/staff/trips}">Bán vé tại quầy</a><a th:href="@{/staff/bookings}">Quản lý đặt vé</a><a th:href="@{/staff/check-in}">Check-in hành khách</a><a class="active" th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav></aside><main class="main"><h1>Tạo yêu cầu hỗ trợ</h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div><form class="card" method="get"><label>Tìm booking (không bắt buộc)<input name="bookingKeyword" th:value="${bookingKeyword}" placeholder="Mã booking, tên hoặc số điện thoại"></label><button class="btn btn-secondary">Tra cứu</button></form><section class="card" th:if="${bookingResults}"><h2>Kết quả booking</h2><div th:each="b:${bookingResults}"><span th:text="${b.bookingCode()+' — '+b.contactName()}"></span> <a class="btn btn-secondary" th:href="@{/staff/support-requests(bookingId=${b.bookingId()})}">Chọn</a></div></section><section class="card" th:if="${selectedBooking}"><h2>Booking đã chọn</h2><p><strong th:text="${selectedBooking.bookingCode()}"></strong> — <span th:text="${selectedBooking.contactName()}"></span></p><a class="btn btn-secondary" th:href="@{/staff/support-requests}">Bỏ liên kết</a></section><form class="card" method="post" th:action="@{/staff/support-requests/create}"><input th:if="${selectedBooking}" type="hidden" name="bookingId" th:value="${selectedBooking.bookingId()}"><label>Chủ đề<input name="subject" required></label><label>Nội dung<textarea name="description" rows="6" required></textarea></label><label><input style="width:auto" type="checkbox" name="escalateToAdmin"> Chuyển yêu cầu cho Admin</label><button class="btn btn-primary">Tạo yêu cầu</button></form><section class="card" th:if="${supportResult}"><h2>Tạo yêu cầu thành công</h2><p>Mã yêu cầu: <span th:text="${supportResult.id()}"></span></p><p>Trạng thái: <span th:text="${supportResult.status()}"></span></p></section></main></div></body></html>
