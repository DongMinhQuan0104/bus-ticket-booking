<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Phát hành vé</title><link rel="stylesheet" th:href="@{/css/staff.css}"><style>@media print{.sidebar,.no-print{display:none}.app{display:block}.main{padding:0}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div></aside><main class="main"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><h1>Thanh toán thành công</h1><p>Vé đã được phát hành cho hành khách.</p><section class="card" th:each="d:${booking.details()}"><h2>Vé <span th:text="${d.ticketCode()}"></span></h2><p>Hành khách: <strong th:text="${d.passengerName()}"></strong></p><p>Ghế: <span th:text="${d.seatCode()}"></span></p><p>Trạng thái: <span th:text="${d.ticketStatus()}"></span></p><p>Giá vé: <span th:text="${d.ticketPrice()}"></span></p></section><div class="actions no-print"><button class="btn btn-primary" onclick="window.print()">In vé</button><a class="btn btn-secondary" th:href="@{/staff/bookings/{id}(id=${booking.bookingId()})}">Xem booking</a><a class="btn btn-secondary" th:href="@{/staff/trips}">Bán vé mới</a></div></main></div></body></html>
