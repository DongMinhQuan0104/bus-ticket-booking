<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Phát hành vé</title><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script>tailwind.config={theme:{extend:{colors:{primary:'#9d4300','primary-container':'#f97316',surface:'#f9f9ff','surface-container-low':'#f0f3ff','on-surface':'#151c27','outline-variant':'#e0c0b1'}}}}</script><style>body{font-family:Inter,sans-serif}@media print{.no-print{display:none!important}}</style></head><body class="bg-surface text-on-surface min-h-screen"><main class="max-w-5xl mx-auto p-8"><div class="bg-white rounded-xl border border-outline-variant p-8 shadow-sm"><div class="text-center mb-8"><span class="material-symbols-outlined text-green-600 text-6xl">check_circle</span><h1 class="text-3xl font-bold mt-3">Thanh toán thành công</h1><p class="text-gray-600 mt-2">Vé đã được phát hành cho hành khách.</p></div><div class="grid md:grid-cols-2 gap-4"><section class="border rounded-xl p-5" th:each="detail : ${booking.details()}"><h2 class="font-bold text-xl">Vé <span th:text="${detail.ticketCode()}">TICKET</span></h2><div class="mt-4 space-y-2"><p>Hành khách: <strong th:text="${detail.passengerName()}"></strong></p><p>Ghế: <span th:text="${detail.seatCode()}"></span></p><p>Trạng thái: <span th:text="${detail.ticketStatus()}"></span></p><p>Giá vé: <span th:text="${detail.ticketPrice()}"></span></p></div></section></div><div class="no-print flex flex-wrap justify-center gap-3 mt-8"><button onclick="window.print()" class="px-5 py-3 bg-primary-container text-white rounded-xl font-bold">In vé</button><a th:href="@{/staff/bookings/{id}(id=${booking.bookingId()})}" class="px-5 py-3 border border-primary-container text-primary-container rounded-xl font-bold">Xem booking</a><a th:href="@{/staff/trips}" class="px-5 py-3 border rounded-xl font-bold">Bán vé mới</a></div></div></main></body></html>
