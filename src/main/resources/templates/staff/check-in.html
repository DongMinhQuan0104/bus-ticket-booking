<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Check-in</title><link rel="stylesheet" th:href="@{/css/staff.css}"></head><body><div class="app"><aside class="sidebar"><div class="brand">Staff Ticket Portal</div><nav class="nav"><a th:href="@{/staff/dashboard}">Tổng quan</a><a th:href="@{/staff/trips}">Bán vé tại quầy</a><a th:href="@{/staff/bookings}">Quản lý đặt vé</a><a class="active" th:href="@{/staff/check-in}">Check-in hành khách</a><a th:href="@{/staff/support-requests}">Hỗ trợ khách hàng</a></nav></aside><main class="main"><h1>Check-in hành khách</h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div><section class="card" th:if="${tripId==null}"><p>Vui lòng chọn chuyến trước khi check-in.</p><a class="btn btn-primary" th:href="@{/staff/trips}">Chọn chuyến</a></section><form class="card" th:if="${tripId!=null}" method="post" th:action="@{/staff/check-in}"><input type="hidden" name="tripId" th:value="${tripId}"><label>Mã vé<input name="ticketCode" required></label><button class="btn btn-primary">Xác nhận check-in</button></form><section class="card" th:if="${checkInResult}"><h2>Check-in thành công</h2><p>Hành khách: <strong th:text="${checkInResult.passengerName()}"></strong></p><p>Ghế: <span th:text="${checkInResult.seatCode()}"></span></p><p>Mã vé: <span th:text="${checkInResult.ticketCode()}"></span></p><p>Thời gian: <span th:text="${checkInResult.checkedInAt()}"></span></p></section></main></div></body></html>
