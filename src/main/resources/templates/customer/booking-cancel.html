<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="light" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hủy vé | Bus Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
            "colors": {
                "background": "#f8f9fa", "surface": "#f8f9fa",
                "surface-container-low": "#f3f4f5", "surface-container-lowest": "#ffffff",
                "surface-container-highest": "#e1e3e4",
                "outline": "#727784", "outline-variant": "#c2c6d4",
                "primary": "#003f87", "on-surface": "#191c1d", "on-surface-variant": "#424752",
                "brand-orange": "#F26A21", "brand-dark": "#0E2A47",
                "tertiary": "#004c17", "error": "#ba1a1a",
                "error-container": "#ffdad6", "on-error-container": "#93000a"
            },
            "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
            "spacing": { "gutter": "24px", "md": "24px", "lg": "48px", "sm": "12px", "xl": "80px", "container-max": "1200px" },
            "fontFamily": { "data-price": ["JetBrains Mono"], "body-main": ["Inter"] }
        }}}
    </script>
    <style>.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; vertical-align: middle; }</style>
</head>
<body class="bg-background text-on-surface font-body-main">

<header class="bg-surface border-b border-outline-variant sticky top-0 z-50">
    <div class="flex justify-between items-center h-20 px-gutter max-w-container-max mx-auto">
        <a class="text-xl font-bold text-brand-dark" th:href="@{/home}">Bus Ticket Booking</a>
        <a class="text-on-surface-variant hover:text-primary" th:href="@{/my-tickets}">← Vé của tôi</a>
    </div>
</header>

<main class="max-w-2xl mx-auto px-gutter py-lg">
    <h1 class="text-2xl font-bold mb-6">Hủy vé &amp; Hoàn tiền</h1>

    <!-- Thong tin ve -->
    <div class="bg-white border border-outline-variant rounded-xl p-md mb-4">
        <h2 class="text-lg font-bold mb-4">Thông tin vé</h2>
        <div class="space-y-2 text-sm">
            <div class="flex justify-between"><span class="text-on-surface-variant">Tuyến</span>
                <span class="font-medium" th:text="${booking.destinationFrom()} + ' → ' + ${booking.destinationTo()}">Tuyến</span></div>
            <div class="flex justify-between"><span class="text-on-surface-variant">Giờ khởi hành</span>
                <span class="font-medium" th:text="${booking.departureTime() != null ? #temporals.format(booking.departureTime(),'HH:mm · dd/MM/yyyy') : 'N/A'}">Giờ</span></div>
            <div class="flex justify-between"><span class="text-on-surface-variant">Ghế</span>
                <span class="font-medium" th:text="${#strings.listJoin(booking.seatCodes(), ', ')}">Ghế</span></div>
            <div class="flex justify-between"><span class="text-on-surface-variant">Tổng đã thanh toán</span>
                <span class="font-data-price" th:text="${booking.totalPrice() != null ? #numbers.formatInteger(booking.totalPrice(),0,'POINT') + 'đ' : '—'}">0đ</span></div>
        </div>
    </div>

    <!-- Chinh sach hoan tien -->
    <div class="bg-white border border-outline-variant rounded-xl p-md mb-4">
        <h2 class="text-lg font-bold mb-4">Chính sách hoàn tiền</h2>
        <div class="space-y-2 text-sm">
            <div class="flex justify-between"><span class="text-on-surface-variant">Thời gian còn lại đến giờ đi</span>
                <span class="font-medium" th:text="${hoursLeft} + ' giờ'">0 giờ</span></div>
            <div class="flex justify-between"><span class="text-on-surface-variant">Mức hoàn</span>
                <span class="font-medium" th:text="${refundPercent} + '%'">0%</span></div>
            <div class="flex justify-between border-t border-dashed border-outline-variant pt-2 mt-2">
                <span class="font-bold">Số tiền được hoàn</span>
                <span class="font-data-price text-tertiary text-lg" th:text="${#numbers.formatInteger(refundAmount,0,'POINT')} + 'đ'">0đ</span></div>
        </div>
        <p class="text-xs text-on-surface-variant mt-3">Áp dụng: ≥24h hoàn 90% · 12–24h hoàn 50% · &lt;12h không hoàn.</p>
    </div>

    <!-- Xac nhan -->
    <form th:action="@{/my-tickets/{id}/cancel(id=${booking.id()})}" method="post" onsubmit="return confirm('Bạn chắc chắn muốn hủy vé này?');">
        <label class="flex items-start gap-2 mb-4 text-sm">
            <input type="checkbox" required class="mt-1 rounded border-outline-variant text-error focus:ring-error"/>
            <span>Tôi đã đọc và đồng ý với chính sách hoàn/hủy vé.</span>
        </label>
        <div class="flex gap-3">
            <a th:href="@{/my-tickets}" class="flex-1 text-center border border-outline-variant font-semibold py-3 rounded-lg hover:bg-surface-container-low">Giữ lại vé</a>
            <button type="submit" class="flex-1 bg-error text-white font-bold py-3 rounded-lg hover:brightness-90 active:translate-y-px">XÁC NHẬN HỦY</button>
        </div>
    </form>
</main>
</body>
</html>
